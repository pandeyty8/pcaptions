<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PCAP Studio</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#070a08;
  color:#ffffff;
  font-family:Arial,Helvetica,sans-serif;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px 15px 60px;
}

h1{
  text-align:center;
  margin:8px 0;
  font-size:32px;
}

.subtitle{
  text-align:center;
  color:#8f9992;
  margin-bottom:25px;
}

.card{
  background:#0d120f;
  border:1px solid #202820;
  border-radius:20px;
  padding:18px;
  margin-bottom:18px;
}

label{
  display:block;
  color:#aeb7b0;
  font-size:13px;
  margin:15px 0 8px;
  font-weight:bold;
}

input,
select,
button{
  width:100%;
  border-radius:12px;
  padding:13px;
  border:1px solid #293229;
  background:#111611;
  color:#ffffff;
  font-size:15px;
}

input[type="range"]{
  padding:0;
}

input[type="color"]{
  height:48px;
  padding:4px;
}

button{
  margin-top:12px;
  border:0;
  background:#25d366;
  color:#031007;
  font-weight:bold;
  cursor:pointer;
}

button.secondary{
  background:#182019;
  color:#ffffff;
  border:1px solid #29352c;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.video-wrap{
  position:relative;
  margin-top:14px;
  background:#000;
  border-radius:17px;
  overflow:hidden;
}

video{
  width:100%;
  max-height:500px;
  display:block;
  background:#000;
}

.caption-preview{
  position:absolute;
  left:50%;
  bottom:12%;
  transform:translateX(-50%);
  width:90%;
  text-align:center;
  font-size:28px;
  font-weight:800;
  color:#ffffff;
  text-shadow:0 3px 10px #000;
  pointer-events:none;
  word-wrap:break-word;
}

.status{
  margin-top:13px;
  padding:12px;
  border-radius:12px;
  background:#111811;
  color:#b9c3bb;
  font-size:14px;
  line-height:1.5;
}

.progress{
  width:100%;
  height:8px;
  margin-top:10px;
  background:#1a211c;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  width:0%;
  height:100%;
  background:#25d366;
  transition:width .2s;
}

.small{
  color:#7f8981;
  font-size:12px;
  margin-top:7px;
}

.caption-box{
  display:none;
}

.caption-item{
  border:1px solid #252d27;
  border-radius:12px;
  padding:11px;
  margin-top:9px;
}

.caption-time{
  color:#25d366;
  font-size:12px;
  margin-bottom:5px;
  font-weight:bold;
}

@keyframes popAnimation{
  0%{
    opacity:0;
    transform:translateX(-50%) scale(.5);
  }
  100%{
    opacity:1;
    transform:translateX(-50%) scale(1);
  }
}

@keyframes bounceAnimation{
  0%,100%{
    transform:translateX(-50%) translateY(0);
  }
  50%{
    transform:translateX(-50%) translateY(-14px);
  }
}

@keyframes shakeAnimation{
  0%,100%{
    transform:translateX(-50%);
  }
  25%{
    transform:translateX(-55%);
  }
  75%{
    transform:translateX(-45%);
  }
}

@keyframes glowAnimation{
  from{
    text-shadow:0 0 5px currentColor;
  }
  to{
    text-shadow:0 0 25px currentColor;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>PCAP Studio</h1>

<div class="subtitle">
AI Video Caption Generator
</div>


<!-- VIDEO -->
<div class="card">

<label>Select Video</label>

<input
  id="videoInput"
  type="file"
  accept="video/*"
>

<div class="video-wrap">

<video
  id="video"
  controls
  playsinline
></video>

<div
  id="captionPreview"
  class="caption-preview"
>
Your Caption
</div>

</div>

</div>


<!-- CAPTION SETTINGS -->
<div class="card">

<label>Caption Text</label>

<input
  id="captionText"
  type="text"
  placeholder="Your Caption"
>


<label>Font</label>

<select id="fontSelect">

<option>Arial</option>
<option>Helvetica</option>
<option>Verdana</option>
<option>Tahoma</option>
<option>Trebuchet MS</option>
<option>Georgia</option>
<option>Times New Roman</option>
<option>Courier New</option>
<option>Impact</option>
<option>Comic Sans MS</option>
<option>Lucida Console</option>
<option>Segoe UI</option>
<option>Roboto</option>
<option>Montserrat</option>
<option>Poppins</option>
<option>Inter</option>
<option>Oswald</option>
<option>Raleway</option>
<option>Nunito</option>
<option>Ubuntu</option>
<option>Playfair Display</option>
<option>Bebas Neue</option>
<option>Anton</option>
<option>Lobster</option>
<option>Pacifico</option>

</select>

<div class="small">
More professional fonts will be added in the next module.
</div>


<label>Animation</label>

<select id="animationSelect">

<option value="none">None</option>
<option value="pop">Pop</option>
<option value="bounce">Bounce</option>
<option value="shake">Shake</option>
<option value="glow">Glow</option>

</select>


<label>Text Size</label>

<input
  id="sizeSlider"
  type="range"
  min="16"
  max="70"
  value="28"
>


<label>Vertical Position</label>

<input
  id="positionSlider"
  type="range"
  min="5"
  max="80"
  value="12"
>


<label>Text Color</label>

<input
  id="textColor"
  type="color"
  value="#ffffff"
>


<label>Glow Color</label>

<input
  id="glowColor"
  type="color"
  value="#25d366"
>


<button id="autoCaptionButton">
🎙️ Generate Auto Captions
</button>


<div
  id="status"
  class="status"
>
Select a video first.
</div>


<div class="progress">

<div
  id="progressBar"
  class="progress-bar"
></div>

</div>

</div>


<!-- GENERATED CAPTIONS -->
<div
  id="captionBox"
  class="card caption-box"
>

<h3>Generated Captions</h3>

<div id="captionList"></div>

</div>


<!-- EXPORT -->
<div class="card">

<button
  id="exportButton"
  class="secondary"
>
🎬 Export Captioned Video
</button>

</div>

</div>


<script type="module">

import {
  pipeline
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


const videoInput =
  document.getElementById("videoInput");

const video =
  document.getElementById("video");

const captionPreview =
  document.getElementById("captionPreview");

const captionText =
  document.getElementById("captionText");

const fontSelect =
  document.getElementById("fontSelect");

const animationSelect =
  document.getElementById("animationSelect");

const sizeSlider =
  document.getElementById("sizeSlider");

const positionSlider =
  document.getElementById("positionSlider");

const textColor =
  document.getElementById("textColor");

const glowColor =
  document.getElementById("glowColor");

const autoCaptionButton =
  document.getElementById("autoCaptionButton");

const exportButton =
  document.getElementById("exportButton");

const status =
  document.getElementById("status");

const progressBar =
  document.getElementById("progressBar");

const captionBox =
  document.getElementById("captionBox");

const captionList =
  document.getElementById("captionList");


let selectedVideo = null;

let transcriber = null;

let generatedCaptions = [];


function setStatus(message){

  status.textContent = message;

}


function setProgress(value){

  progressBar.style.width =
    Math.max(0,Math.min(100,value)) + "%";

}


videoInput.addEventListener(
  "change",
  function(){

    const file =
      videoInput.files[0];

    if(!file){

      return;

    }

    selectedVideo = file;

    const url =
      URL.createObjectURL(file);

    video.src = url;

    video.load();

    captionPreview.textContent =
      "Your Caption";

    setStatus(
      "Video loaded. Press Generate Auto Captions."
    );

    setProgress(0);

  }
);


captionText.addEventListener(
  "input",
  function(){

    captionPreview.textContent =
      captionText.value ||
      "Your Caption";

  }
);


fontSelect.addEventListener(
  "change",
  function(){

    captionPreview.style.fontFamily =
      fontSelect.value;

  }
);


sizeSlider.addEventListener(
  "input",
  function(){

    captionPreview.style.fontSize =
      sizeSlider.value + "px";

  }
);


positionSlider.addEventListener(
  "input",
  function(){

    captionPreview.style.bottom =
      positionSlider.value + "%";

  }
);


textColor.addEventListener(
  "input",
  function(){

    captionPreview.style.color =
      textColor.value;

  }
);


glowColor.addEventListener(
  "input",
  function(){

    captionPreview.style.textShadow =
      "0 0 12px " +
      glowColor.value +
      ", 0 3px 10px #000";

  }
);


animationSelect.addEventListener(
  "change",
  function(){

    captionPreview.style.animation =
      "none";

    if(animationSelect.value === "pop"){

      captionPreview.style.animation =
        "popAnimation .5s ease";

    }

    if(animationSelect.value === "bounce"){

      captionPreview.style.animation =
        "bounceAnimation .7s ease";

    }

    if(animationSelect.value === "shake"){

      captionPreview.style.animation =
        "shakeAnimation .4s ease";

    }

    if(animationSelect.value === "glow"){

      captionPreview.style.animation =
        "glowAnimation 1s infinite alternate";

    }

  }
);


function formatTime(seconds){

  const totalSeconds =
    Math.max(0,Math.floor(seconds || 0));

  const minutes =
    Math.floor(totalSeconds / 60);

  const secs =
    totalSeconds % 60;

  return (
    String(minutes).padStart(2,"0") +
    ":" +
    String(secs).padStart(2,"0")
  );

}


function escapeHTML(text){

  const element =
    document.createElement("div");

  element.textContent =
    text;

  return element.innerHTML;

}


function showCaptions(chunks){

  captionList.innerHTML = "";

  chunks.forEach(function(chunk){

    const item =
      document.createElement("div");

    item.className =
      "caption-item";

    const start =
      chunk.timestamp &&
      chunk.timestamp[0] != null
      ? chunk.timestamp[0]
      : 0;

    const end =
      chunk.timestamp &&
      chunk.timestamp[1] != null
      ? chunk.timestamp[1]
      : start;

    item.innerHTML =
      `
      <div class="caption-time">
        ${formatTime(start)}
        →
        ${formatTime(end)}
      </div>

      <div>
        ${escapeHTML(chunk.text || "")}
      </div>
      `;

    captionList.appendChild(item);

  });

  captionBox.style.display =
    "block";

}


async function createTranscriber(){

  if(transcriber){

    return transcriber;

  }

  setStatus(
    "Downloading the AI speech model. The first download can take some time..."
  );

  transcriber =
    await pipeline(
      "automatic-speech-recognition",
      "onnx-community/whisper-tiny"
    );

  return transcriber;

}


async function generateCaptions(){

  if(!selectedVideo){

    setStatus(
      "Please select a video first."
    );

    return;

  }


  autoCaptionButton.disabled =
    true;


  try{

    setProgress(5);

    setStatus(
      "Preparing your video audio..."
    );


    /*
      The browser decodes the uploaded
      video into audio samples.
    */

    const arrayBuffer =
      await selectedVideo.arrayBuffer();


    setProgress(15);


    const audioContext =
      new AudioContext();


    const decodedAudio =
      await audioContext.decodeAudioData(
        arrayBuffer
      );


    setProgress(25);


    /*
      Whisper expects 16 kHz audio.
    */

    const targetSampleRate =
      16000;

    const duration =
      decodedAudio.duration;


    const frameCount =
      Math.ceil(
        duration * targetSampleRate
      );


    const offlineContext =
      new OfflineAudioContext(
        1,
        frameCount,
        targetSampleRate
      );


    const source =
      offlineContext.createBufferSource();


    source.buffer =
      decodedAudio;


    source.connect(
      offlineContext.destination
    );


    source.start(0);


    setStatus(
      "Converting audio for the AI model..."
    );


    const renderedAudio =
      await offlineContext.startRendering();


    await audioContext.close();


    const audioData =
      renderedAudio.getChannelData(0);


    setProgress(35);


    setStatus(
      "Loading Whisper AI..."
    );


    const pipe =
      await createTranscriber();


    setProgress(55);


    setStatus(
      "AI is transcribing the video. Please wait..."
    );


    const result =
      await pipe(
        audioData,
        {
          chunk_length_s:30,
          stride_length_s:5,
          return_timestamps:true
        }
      );


    setProgress(90);


    generatedCaptions =
      result.chunks || [];


    if(
      generatedCaptions.length === 0 &&
      result.text
    ){

      generatedCaptions = [

        {
          timestamp:[
            0,
            video.duration || 0
          ],

          text:result.text
        }

      ];

    }


    showCaptions(
      generatedCaptions
    );


    captionText.value =
      result.text || "";


    captionPreview.textContent =
      result.text ||
      "Caption";


    setProgress(100);


    setStatus(
      "✅ Auto captions generated successfully."
    );


  }
  catch(error){

    console.error(error);

    setProgress(0);

    setStatus(
      "❌ Error: " +
      (error && error.message
        ? error.message
        : String(error))
    );

  }
  finally{

    autoCaptionButton.disabled =
      false;

  }

}


autoCaptionButton.addEventListener(
  "click",
  generateCaptions
);


exportButton.addEventListener(
  "click",
  function(){

    alert(
      "The caption export engine will be connected in the next module."
    );

  }
);

</script>

</body>
</html>
