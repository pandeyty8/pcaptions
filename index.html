<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PCAP Studio</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#070a08;
  color:#fff;
  font-family:Arial,sans-serif;
}
.container{
  max-width:900px;
  margin:auto;
  padding:22px 16px 60px;
}
h1{
  text-align:center;
  margin:10px 0 5px;
  font-size:32px;
}
.sub{
  text-align:center;
  color:#9aa39d;
  margin-bottom:25px;
}
.card{
  background:#0d120f;
  border:1px solid #202720;
  border-radius:22px;
  padding:18px;
  margin-bottom:18px;
}
label{
  display:block;
  color:#aeb7b0;
  font-size:13px;
  margin:16px 0 8px;
  text-transform:uppercase;
}
input,select,button{
  width:100%;
  padding:14px;
  border-radius:13px;
  border:1px solid #252d27;
  background:#111611;
  color:white;
  font-size:15px;
}
input[type="file"]{
  padding:12px;
}
input[type="range"]{
  padding:0;
}
input[type="color"]{
  height:48px;
  padding:4px;
}
button{
  border:0;
  background:#25d366;
  color:#031007;
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
}
button.secondary{
  background:#182019;
  color:#fff;
  border:1px solid #29352c;
}
button:disabled{
  opacity:.5;
}
video{
  width:100%;
  max-height:500px;
  border-radius:18px;
  background:#000;
  margin-top:12px;
}
.status{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#111811;
  color:#b9c3bb;
  font-size:14px;
  line-height:1.5;
}
.progress{
  width:100%;
  height:8px;
  background:#1a211c;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}
.progress div{
  height:100%;
  width:0%;
  background:#25d366;
  transition:.2s;
}
.preview{
  position:relative;
  overflow:hidden;
}
.captionPreview{
  position:absolute;
  left:50%;
  bottom:12%;
  transform:translateX(-50%);
  width:90%;
  text-align:center;
  font-size:28px;
  font-weight:800;
  text-shadow:0 3px 10px #000;
  pointer-events:none;
}
.small{
  color:#7f8981;
  font-size:12px;
  margin-top:7px;
}
.captionsBox{
  display:none;
}
.captionItem{
  border:1px solid #252d27;
  border-radius:12px;
  padding:10px;
  margin-top:9px;
}
.captionTime{
  color:#25d366;
  font-size:12px;
  margin-bottom:6px;
}
</style>
</head>

<body>

<div class="container">

<h1>PCAP Studio</h1>
<div class="sub">AI Video Caption Generator</div>

<div class="card">

<label>Video</label>
<input id="videoInput" type="file" accept="video/*">

<div class="preview">
<video id="video" controls playsinline></video>
<div id="captionPreview" class="captionPreview">Your Caption</div>
</div>

</div>

<div class="card">

<label>Caption</label>
<input id="captionText" type="text" placeholder="Your Caption">

<label>Font</label>
<select id="fontSelect">
<option>Arial</option>
<option>Helvetica</option>
<option>Verdana</option>
<option>Tahoma</option>
<option>Trebuchet MS</option>
<option>Georgia</option>
<option>Times New Roman</option>
<option>Courier New</option>
<option>Impact</option>
<option>Comic Sans MS</option>
<option>Lucida Console</option>
<option>Segoe UI</option>
<option>Roboto</option>
<option>Montserrat</option>
<option>Poppins</option>
<option>Inter</option>
<option>Oswald</option>
<option>Raleway</option>
<option>Nunito</option>
<option>Ubuntu</option>
<option>Playfair Display</option>
<option>Bebas Neue</option>
<option>Anton</option>
<option>Lobster</option>
<option>Pacifico</option>
</select>

<div class="small">100+ fonts will be added in the next design module.</div>

<label>Animation</label>
<select id="animation">
<option value="none">None</option>
<option value="pop">Pop</option>
<option value="bounce">Bounce</option>
<option value="shake">Shake</option>
<option value="glow">Glow</option>
</select>

<label>Text Size</label>
<input id="size" type="range" min="16" max="70" value="28">

<label>Vertical Position</label>
<input id="position" type="range" min="5" max="80" value="12">

<label>Text Color</label>
<input id="textColor" type="color" value="#ffffff">

<label>Glow Color</label>
<input id="glowColor" type="color" value="#25d366">

<button id="autoBtn">🎙️ Generate Auto Captions</button>

<div class="status" id="status">
Select a video and press Generate Auto Captions.
</div>

<div class="progress">
<div id="progressBar"></div>
</div>

</div>

<div class="card captionsBox" id="captionsBox">

<h3>Generated Captions</h3>

<div id="captionList"></div>

</div>

<div class="card">

<button class="secondary" id="exportBtn">
🎬 Export Captioned Video
</button>

</div>

</div>


<script type="module">

import { pipeline }
from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


const videoInput = document.getElementById("videoInput");
const video = document.getElementById("video");
const autoBtn = document.getElementById("autoBtn");
const exportBtn = document.getElementById("exportBtn");
const statusBox = document.getElementById("status");
const progressBar = document.getElementById("progressBar");
const captionText = document.getElementById("captionText");
const captionPreview = document.getElementById("captionPreview");
const fontSelect = document.getElementById("fontSelect");
const animation = document.getElementById("animation");
const size = document.getElementById("size");
const position = document.getElementById("position");
const textColor = document.getElementById("textColor");
const glowColor = document.getElementById("glowColor");
const captionsBox = document.getElementById("captionsBox");
const captionList = document.getElementById("captionList");

let videoFile = null;
let transcriber = null;
let generatedChunks = [];


function setStatus(text){
  statusBox.textContent = text;
}


function setProgress(value){
  progressBar.style.width = Math.max(0,Math.min(100,value)) + "%";
}


videoInput.addEventListener("change",e=>{

  videoFile = e.target.files[0];

  if(!videoFile) return;

  const url = URL.createObjectURL(videoFile);

  video.src = url;
  video.load();

  setStatus("Video loaded. Press Generate Auto Captions.");

  captionPreview.textContent = "Your Caption";

});


captionText.addEventListener("input",()=>{
  captionPreview.textContent =
    captionText.value || "Your Caption";
});


fontSelect.addEventListener("change",()=>{
  captionPreview.style.fontFamily = fontSelect.value;
});


size.addEventListener("input",()=>{
  captionPreview.style.fontSize = size.value + "px";
});


position.addEventListener("input",()=>{
  captionPreview.style.bottom = position.value + "%";
});


textColor.addEventListener("input",()=>{
  captionPreview.style.color = textColor.value;
});


glowColor.addEventListener("input",()=>{
  captionPreview.style.textShadow =
    "0 0 12px " + glowColor.value +
    ",0 3px 10px #000";
});


animation.addEventListener("change",()=>{

  captionPreview.style.animation = "none";

  if(animation.value==="pop"){
    captionPreview.style.animation =
      "pcapPop .5s ease";
  }

  if(animation.value==="bounce"){
    captionPreview.style.animation =
      "pcapBounce .7s ease";
  }

  if(animation.value==="shake"){
    captionPreview.style.animation =
      "pcapShake .4s ease";
  }

  if(animation.value==="glow"){
    captionPreview.style.animation =
      "pcapGlow 1s infinite alternate";
  }

});


function formatTime(sec){

  sec = Math.max(0,sec || 0);

  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60);

  return String(m).padStart(2,"0") +
         ":" +
         String(s).padStart(2,"0");

}


async function extractAudio(file){

  const arrayBuffer = await file.arrayBuffer();

  const audioContext =
    new AudioContext();

  const decoded =
    await audioContext.decodeAudioData(arrayBuffer);

  const targetRate = 16000;

  const duration = decoded.duration;

  const offline =
    new OfflineAudioContext(
      1,
      Math.ceil(duration * targetRate),
      targetRate
    );

  const source =
    offline.createBufferSource();

  source.buffer = decoded;

  source.connect(offline.destination);

  source.start(0);

  const rendered =
    await offline.startRendering();

  await audioContext.close();

  return rendered.getChannelData(0);

}


async function getTranscriber(){

  if(transcriber) return transcriber;

  setStatus(
    "Downloading AI speech model for the first time. This may take a while..."
  );

  transcriber =
    await pipeline(
      "automatic-speech-recognition",
      "onnx-community/whisper-tiny"
    );

  return transcriber;

}


function showCaptions(chunks){

  captionList.innerHTML = "";

  chunks.forEach((chunk,index)=>{

    const div =
      document.createElement("div");

    div.className = "captionItem";

    const start =
      chunk.timestamp?.[0] ?? 0;

    const end =
      chunk.timestamp?.[1] ?? start;

    div.innerHTML =
      `<div class="captionTime">
        ${formatTime(start)} → ${formatTime(end)}
      </div>
      <div>${escapeHtml(chunk.text || "")}</div>`;

    captionList.appendChild(div);

  });

  captionsBox.style.display = "block";

}


function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


autoBtn.addEventListener("click",async()=>{

  if(!videoFile){

    setStatus("Please select a video first.");

    return;

  }

  autoBtn.disabled = true;

  try{

    setProgress(5);

    setStatus("Reading video audio...");

    const audio =
      await extractAudio(videoFile);

    setProgress(20);

    setStatus(
      "Loading Whisper AI model..."
    );

    const pipe =
      await getTranscriber();

    setProgress(40);

    setStatus(
      "AI is transcribing your video. Please wait..."
    );

    const output =
      await pipe(
        audio,
        {
          chunk_length_s: 30,
          stride_length_s: 5,
          return_timestamps: true
        }
      );

    setProgress(90);

    generatedChunks =
      output.chunks || [];

    if(!generatedChunks.length){

      generatedChunks = [{
        timestamp:[0,video.duration || 0],
        text:output.text || ""
      }];

    }

    showCaptions(generatedChunks);

    captionText.value =
      output.text || "";

    captionPreview.textContent =
      output.text || "Caption";

    setProgress(100);

    setStatus(
      "✅ Auto captions generated successfully."
    );

  }catch(error){

    console.error(error);

    setProgress(0);

    setStatus(
      "❌ Caption generation failed: " +
      (error.message || error)
    );

  }finally{

    autoBtn.disabled = false;

  }

});


exportBtn.addEventListener("click",()=>{

  alert(
    "Caption export engine will be connected in the next module. Auto Caption Engine is now active."
  );

});


const style =
document.createElement("style");

style.textContent = `

@keyframes pcapPop{
  0%{transform:translateX(-50%) scale(.5);opacity:0}
  100%{transform:translateX(-50%) scale(1);opacity:1}
}

@keyframes pcapBounce{
  0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(-15px)}
}

@keyframes pcapShake{
  0%,100%{transform:translateX(-50%)}
  25%{transform:translateX(-55%)}
  75%{transform:translateX(-45%)}
}

@keyframes pcapGlow{
  from{text-shadow:0 0 4px currentColor}
  to{text-shadow:0 0 25px currentColor}
}

`;

document.head.appendChild(style);

</script>

</body>
</html>
